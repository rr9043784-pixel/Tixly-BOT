name: Tixly Python Check

on:
push:
branches:
- main
pull_request:
branches:
- main
workflow_dispatch:

jobs:
check:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Check Python syntax
    run: python -m compileall -q bot api
